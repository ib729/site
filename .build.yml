image: alpine/edge
oauth: pages.sr.ht/PAGES:RW
packages:
  - hut
environment:
  site: ivanbelousov.com
sources:
  - https://git.sr.ht/~ivanbelousov/site
tasks:
  - update-year: |
      cd site
      CURRENT_YEAR=$(date +%Y)
      sed -i "s/{{YEAR}}/$CURRENT_YEAR/g" index.html 
  - package: |
      cd site
      tar --exclude=.git -czf ../site.tar.gz .
  - upload: |
      hut pages publish -d $site site.tar.gz
