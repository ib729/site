image: alpine/edge
oauth: pages.sr.ht/PAGES:RW
packages:
  - hut
environment:
  site: ivanbelousov.srht.site
sources:
  - https://git.sr.ht/~ivanbelousov/site
tasks:
  - update-year: |
      cd site
      CURRENT_YEAR=$(date +%Y)
      sed -i "s/{{YEAR_RANGE}}/2024–$CURRENT_YEAR/g" index.html
      sed -i "s/{{YEAR_RANGE}}/2024–$CURRENT_YEAR/g" LICENSE
  - package: |
      cd site
      tar -cvz . > ../site.tar.gz
  - upload: |
      hut pages publish -d $site ../site.tar.gz
